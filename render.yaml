services:
  # ---------------------------------------------------------------------------
  # 1. Backend REST API (NestJS + Prisma)
  # ---------------------------------------------------------------------------
  - type: web
    name: gravitas-edge-api
    runtime: node
    plan: free
    region: oregon # or frankfurt, singapore, ohio
    buildCommand: npm ci && npx prisma generate --schema=prisma/schema.prisma && npm run build:api
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gravitas-edge-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: RAZORPAY_KEY_ID
        value: rzp_test_placeholder
      - key: RAZORPAY_KEY_SECRET
        value: placeholder_secret
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_PATH
        value: ./storage
      - key: CORS_ORIGINS
        value: https://gravitas-edge-website.onrender.com,https://gravitas-edge-admin.onrender.com

  # ---------------------------------------------------------------------------
  # 2. Frontend User Website (Next.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: gravitas-edge-website
    runtime: node
    plan: free
    region: oregon # match the same region as the API and database
    buildCommand: npm ci && npm run build:website
    startCommand: npm run start --workspace=apps/website
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        value: https://gravitas-edge-api.onrender.com/api

  # ---------------------------------------------------------------------------
  # 3. Admin Panel (Next.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: gravitas-edge-admin
    runtime: node
    plan: free
    region: oregon # match the same region as the API and database
    buildCommand: npm ci && npm run build:admin
    startCommand: npm run start --workspace=apps/admin
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        value: https://gravitas-edge-api.onrender.com/api

databases:
  # ---------------------------------------------------------------------------
  # 4. Managed PostgreSQL Database
  # ---------------------------------------------------------------------------
  - name: gravitas-edge-db
    databaseName: job_portal
    user: job_portal_user
    plan: free
    region: oregon
